name: Multi Services

on:
  push:
    branches:
      - Test

jobs:
  detect_changes:
    runs-on: ubuntu-latest
    outputs:
      folder1: ${{ steps.filter.outputs.folder1 }}
      folder2: ${{ steps.filter.outputs.folder2 }}
      folder3_test3: ${{ steps.filter.outputs.folder3_test3 }}
      folder3_test4: ${{ steps.filter.outputs.folder3_test4 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed folders
        id: filter
        uses: dorny/paths-filter@v3
        with:
          base: ${{ github.event.before }}
          ref: ${{ github.sha }}
          filters: |
            folder2:
              - 'Folder2/**'
            folder3_test3:
              - 'Folder3/Test3/**'
            folder3_test4:
              - 'Folder3/Test4/**'
  service_1_ci_cd:
    name: My_app1
    needs: detect_changes
    if: ${{ needs.detect_changes.outputs.folder1 == 'true' }}
    uses: ./.github/workflows/ci_cd_service_1.yml
    with:
      service_path: Folder1
      environment: dev
    secrets: inherit  

  service_2_ci_cd:
    name: My_app2
    needs: detect_changes
    if: ${{ needs.detect_changes.outputs.folder2 == 'true' }}
    uses: ./.github/workflows/ci_cd_service_2.yml
    with:
      service_path: Folder2
      environment: dev
    secrets: inherit

  service_3_ci_cd:
    name: My_app3
    needs: detect_changes
    if: ${{ needs.detect_changes.outputs.folder3_test3 == 'true' }}
    uses: ./.github/workflows/ci_cd_service_3.yml
    with:
      service_path: Folder3/Test3
      environment: dev
    secrets: inherit

  service_4_ci_cd:
    name: My_app4
    needs: detect_changes
    if: ${{ needs.detect_changes.outputs.folder3_test4 == 'true' }}
    uses: ./.github/workflows/ci_cd_service_4.yml
    with:
      service_path: Folder3/Test4
      environment: dev
    secrets: inherit