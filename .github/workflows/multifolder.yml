name: Test-Multifolder
on:
  push:
    branches: 
     - Test

jobs:
  detect_changes:
    runs-on: ubuntu-latest
    outputs:
      folder1: ${{ steps.filter.outputs.folder1 }}
      folder2: ${{ steps.filter.outputs.folder2 }}
      folder3_test3: ${{ steps.filter.outputs.folder3_test3 }}
      folder3_test4: ${{ steps.filter.outputs.folder3_test4 }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Detect changed folders
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            folder1:
              - 'Folder1/**'
            folder2:
              - 'Folder2/**'
            folder3_test3:
              - 'Folder3/Test3/**'
            folder3_test4:
              - 'Folder3/Test4/**'

  test_folder1:
    needs: detect_changes
    if: ${{ needs.detect_changes.outputs.folder1 == 'true' }}
    uses: ./.github/workflows/reusable-tests.yml
    with:
      target: Folder1
    secrets: inherit

  test_folder2:
    needs: detect_changes
    if: ${{ needs.detect_changes.outputs.folder2 == 'true' }}
    uses: ./.github/workflows/reusable-tests.yml
    with:
      target: Folder2
    secrets: inherit

  test_folder3_test3:
    needs: detect_changes
    if: ${{ needs.detect_changes.outputs.folder3_test3 == 'true' }}
    uses: ./.github/workflows/reusable-tests.yml
    with:
      target: Folder3/Test3
    secrets: inherit

  test_folder3_test4:
    needs: detect_changes
    if: ${{ needs.detect_changes.outputs.folder3_test4 == 'true' }}
    uses: ./.github/workflows/reusable-tests.yml
    with:
      target: Folder3/Test4
    secrets: inherit
