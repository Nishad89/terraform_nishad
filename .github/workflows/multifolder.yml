name: Reusable Tests

on:
  workflow_call:
    inputs:
      target:
        description: Folder or component under test
        required: true
        type: string

jobs:
  run_tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Run tests
        run: |
          echo "Testing ${{ inputs.target }}"
