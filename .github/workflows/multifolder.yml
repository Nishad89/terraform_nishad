name: Test-Multifolder
on:
  push:
    branches: 
     - Test

jobs:
  Test:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Set up Node.js for running JS files
      - name: Set up Node.js
        uses: actions/setup-node@v2

  check_changes:
    runs-on: ubuntu-latest
    outputs:
      Folder1_changed: ${{ steps.check_Folder1.outputs.changed }}
      Folder2_changed: ${{ steps.check_Folder2.outputs.changed }}
      Folder3_changed: ${{ steps.check_Folder3.outputs.changed }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v2
        with:
          fetch-depth: 0

      - name: Resolve diff range
        id: diff_range
        run: |
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            BEFORE=$(git rev-parse HEAD~1 2>/dev/null || git hash-object -t tree /dev/null)
          fi
          echo "before=$BEFORE" >> "$GITHUB_OUTPUT"
          echo "after=${{ github.sha }}" >> "$GITHUB_OUTPUT"
      
      # Check if folder1 has changes
      - name: Check if folder1 has changes
        id: check_Folder1
        run: |
          echo "Checking if folder1 has changes..."
          CHANGES=$(git diff --name-only "${{ steps.diff_range.outputs.before }}" "${{ steps.diff_range.outputs.after }}" | grep '^Folder1/' || echo "")
          if [ -z "$CHANGES" ]; then
            echo "No changes in folder1"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Changes found in folder1"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Check if folder2 has changes
      - name: Check if folder2 has changes
        id: check_Folder2
        run: |
          echo "Checking if folder2 has changes..."
          CHANGES=$(git diff --name-only "${{ steps.diff_range.outputs.before }}" "${{ steps.diff_range.outputs.after }}" | grep '^Folder2/' || echo "")
          if [ -z "$CHANGES" ]; then
            echo "No changes in folder2"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Changes found in folder2"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Check if folder3 has changes
      - name: Check if folder3 has changes
        id: check_Folder3
        run: |
          echo "Checking if folder3 has changes..."
          CHANGES=$(git diff --name-only "${{ steps.diff_range.outputs.before }}" "${{ steps.diff_range.outputs.after }}" | grep '^Folder3/' || echo "")
          if [ -z "$CHANGES" ]; then
            echo "No changes in folder3"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Changes found in folder3"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  test_folder1:
    needs: check_changes
    runs-on: ubuntu-latest
    if: ${{ needs.check_changes.outputs.Folder1_changed == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Run tests for Folder 1
        run: |
          echo "Testing Folder 1"

  test_folder2:
    needs: check_changes
    runs-on: ubuntu-latest
    if: ${{ needs.check_changes.outputs.Folder2_changed == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Run tests for Folder 2
        run: |
          echo "Testing Folder 2"

  test_folder3:
    needs: check_changes
    runs-on: ubuntu-latest
    if: ${{ needs.check_changes.outputs.Folder3_changed == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Run tests for Folder 3
        run: |
          echo "Testing Folder 3"
