name: Test-Multifolder
on:
  push:
    branches: 
     - Test
jobs:
  detect_changes:
    runs-on: ubuntu-latest
    outputs:
      folder1: ${{ steps.filter.outputs.folder1 }}
      folder2: ${{ steps.filter.outputs.folder2 }}
      folder3_test3: ${{ steps.filter.outputs.folder3_test3 }}
      folder3_test4: ${{ steps.filter.outputs.folder3_test4 }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect changed folders
        id: filter
        uses: dorny/paths-filter@v3
        with:
          base: ${{ github.event.before }}
          ref: ${{ github.sha }}
          filters: |
            folder1:
              - 'Folder1/**'
            folder2:
              - 'Folder2/**'
            folder3_test3:
              - 'Folder3/Test3/**'
            folder3_test4:
              - 'Folder3/Test4/**'

  test_folder1:
    name: Service 1
    needs: detect_changes
    if: ${{ needs.detect_changes.outputs.folder1 == 'true' }}
    uses: ./.github/workflows/ci_service_1.yml
    secrets: inherit

  test_folder2:
    name: Service 2
    needs: detect_changes
    if: ${{ needs.detect_changes.outputs.folder2 == 'true' }}
    uses: ./.github/workflows/ci_service_2.yml
    secrets: inherit

  test_folder3_test3:
    name: Service 3
    needs: detect_changes
    if: ${{ needs.detect_changes.outputs.folder3_test3 == 'true' }}
    uses: ./.github/workflows/ci_service_3.yml
    secrets: inherit
  test_folder3_test4:
    name: Service 4
    needs: detect_changes
    if: ${{ needs.detect_changes.outputs.folder3_test4 == 'true' }}
    uses: ./.github/workflows/ci_service_4.yml
    secrets: inherit

  ECS-Deploy-Dev:
    name: Deploy to Dev
    needs: [detect_changes, cd_service_1, cd_service_2, cd_service_3, cd_service_4]
    if: ${{ always() && (needs.detect_changes.outputs.folder1 == 'true' || needs.detect_changes.outputs.folder2 == 'true' || needs.detect_changes.outputs.folder3_test3 == 'true' || needs.detect_changes.outputs.folder3_test4 == 'true') && (needs.detect_changes.outputs.folder1 != 'true' || needs.cd_service_1.result == 'success') && (needs.detect_changes.outputs.folder2 != 'true' || needs.cd_service_2.result == 'success') && (needs.detect_changes.outputs.folder3_test3 != 'true' || needs.cd_service_3.result == 'success') && (needs.detect_changes.outputs.folder3_test4 != 'true' || needs.cd_service_4.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Dev
        run: echo "Deploying to Dev environment"

  cd_service_1:
    name: CD Service 1
    needs: test_folder1
    if: ${{ needs.test_folder1.result == 'success' }}
    uses: ./.github/workflows/cd_service_1.yml
    secrets: inherit

  cd_service_2:
    name: CD Service 2
    needs: test_folder2
    if: ${{ needs.test_folder2.result == 'success' }}
    uses: ./.github/workflows/cd_service_2.yml
    secrets: inherit

  cd_service_3:
    name: CD Service 3
    needs: test_folder3_test3
    if: ${{ needs.test_folder3_test3.result == 'success' }}
    uses: ./.github/workflows/cd_service_3.yml
    secrets: inherit

  cd_service_4:
    name: CD Service 4
    needs: test_folder3_test4
    if: ${{ needs.test_folder3_test4.result == 'success' }}
    uses: ./.github/workflows/cd_service_4.yml
    secrets: inherit
      