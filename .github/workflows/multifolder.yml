name: MultiFolder
on:
  push:
    branches: 
     - Multi_folder
     
jjobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the code from the repository
      - name: Checkout Code
        uses: actions/checkout@v2

      # Step 2: Set up Node.js for running JS files
      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '14'  # Use a specific Node.js version, adjust as needed

      # Step 3: Test Folder1 (Node.js App)
      - name: Test Folder 1
        working-directory: ./folder1
        run: |
          echo "Running test for Folder 1"
          node index.js  # This will print "Hello from Folder 1!" to the logs
          echo "Folder 1 test complete!"

      # Step 4: Test Folder2 (Node.js App)
      - name: Test Folder 2
        working-directory: ./folder2
        run: |
          echo "Running test for Folder 2"
          node index.js  # This will print "Hello from Folder 2!" to the logs
          echo "Folder 2 test complete!"

      # Step 5: Test Folder3 (Static HTML)
      - name: Test Folder 3 (Static HTML)
        working-directory: ./folder3
        run: |
          echo "Running test for Folder 3"
          node index.js  # This will print "Hello from Folder 2!" to the logs
          echo "Folder 2 test complete!"