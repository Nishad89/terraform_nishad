name: IaC
on:
  push:
    branches: 
     - Iac-cft-githubaction
     
jobs:
  deploy-dev:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

  
      - name: validate ec2 cft
        run : aws cloudformation validate-template --template-body file://templates/ec2.yaml
      - name: Deploy EC2 Stack
        run: |
          aws cloudformation deploy \
            --template-file templates/ec2.yaml \
            --stack-name "dev-ec2-stack" \
            --parameter-overrides file://params/dev-ec2.json \
            --capabilities CAPABILITY_NAMED_IAM

      # - name: validate s3 cft
      #   run : aws cloudformation validate-template --template-body file://templates/s3.yaml
      # - name: validate S3 cft
      # - name: Deploy S3 Stack
      #   run: |
      #     aws cloudformation deploy \
      #       --template-file templates/s3.yaml \
      #       --stack-name "dev-s3-stack" \
      #       --parameter-overrides file://params/dev-s3.json \
      #       --capabilities CAPABILITY_NAMED_IAM
  qa-approval:
    needs: dev-deploy
    runs-on: ubuntu-latest
    environment:
      name: qa
    steps:
      - name: Deploy to QA
        run: echo "Deploying to QA..."