name: CI-CD Service 4

on:
  workflow_call:
    inputs:
      service_path:
        required: false
        type: string
        default: Folder3/Test4
      environment:
        required: false
        type: string
        default: dev

jobs:
  ci:
    name: Build - service_4
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.service_path }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run CI
        run: echo "Running CI for service_4 in ${{ inputs.service_path }}"

  cd:
    name: Deploy - service_4
    needs: ci
    if: ${{ needs.ci.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run CD
        run: echo "Deploying service_4 from ${{ inputs.service_path }} to ${{ inputs.environment }}"