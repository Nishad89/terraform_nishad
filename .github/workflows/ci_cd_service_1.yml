name: CI-CD Service 1

on:
  workflow_call:
    inputs:
      service_path:
        required: false
        type: string
        default: Folder1
      environment:
        required: false
        type: string
        default: dev

jobs:
  ci:
    name: CI - service_1
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.service_path }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run CI
        run: echo "Running CI for service_1 in ${{ inputs.service_path }}"

  cd:
    name: CD - service_1
    needs: ci
    if: ${{ needs.ci.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run CD
        run: echo "Deploying service_1 from ${{ inputs.service_path }} to ${{ inputs.environment }}"